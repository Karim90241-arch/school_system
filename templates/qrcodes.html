<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طباعة رموز QR للمتربصين</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; padding: 30px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        
        .qr-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 15px; 
            margin-top: 20px; 
        }
        
        .qr-card { 
            background: #1e293b; 
            padding: 15px; 
            border-radius: 10px; 
            border: 1px solid #334155; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .trainee-info { margin-bottom: 12px; font-size: 0.95rem; }
        .trainee-info strong { display: block; font-size: 1.05rem; color: #f8fafc; margin-bottom: 4px; }
        .trainee-info span { color: #94a3b8; font-size: 0.85rem; }
        
        /* ضبط صندوق الكيور كود ليكون نظيفاً ومناسباً للصورة */
        .qr-box { 
            width: 100px; 
            height: 100px; 
            background: white; 
            padding: 5px; 
            border-radius: 6px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        
        .btn-print-all { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        
        @media print {
            body { background: white; color: black; padding: 0; }
            .no-print, .btn-print-all { display: none !important; } 
            
            .qr-grid { 
                grid-template-columns: repeat(4, 1fr) !important; 
                gap: 15px !important; 
            }
            .qr-card { 
                background: white !important; 
                color: black !important; 
                border: 1px dashed #000 !important; 
                box-shadow: none !important; 
                page-break-inside: avoid; 
                padding: 12px !important;
            }
            .trainee-info strong { color: black !important; }
            .trainee-info span { color: #555 !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="no-print" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px;">
            <div>
                <h2>🔲 بوابة تجهيز وطباعة الـ QR Codes الحقيقية</h2>
                <p style="color:#94a3b8; margin: 0;">جاهز للمسح عبر كاميرا هاتف المشرف لرصد الغياب التلقائي.</p>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button onclick="window.print()" class="btn-print-all">🖨️ إرسال أمر طباعة للورقة كاملة</button>
                <a href="/dashboard" style="color:#3b82f6; text-decoration:none; font-weight:bold;">← العودة</a>
            </div>
        </div>
        
        <div class="qr-grid">
            {% for t in trainees %}
            <div class="qr-card">
                <div class="trainee-info">
                    <strong>{{ t.name }}</strong>
                    <span>المعرف: #{{ t.id }}</span><br>
                    <span style="font-size:0.75rem;">{{ t.section }}</span>
                </div>
                <div class="qr-box" id="qr-{{ t.id }}"></div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        // كود توليد الرموز الحقيقية بناءً على رقم ID كل متربص عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', (event) => {
            {% for t in trainees %}
                new QRCode(document.getElementById("qr-{{ t.id }}"), {
                    text: "{{ t.id }}", // النص المشفر داخل الكود (المعرف الرقمي)
                    width: 100,
                    height: 100,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            {% endfor %}
        });
    </script>
</body>
</html>

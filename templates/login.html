<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الدخول إلى النظام</title>
    <style>
        body { background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .login-card { background: #1e293b; padding: 40px; border-radius: 12px; text-align: center; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); color: white; }
        input { width: 100%; padding: 12px; margin: 12px 0; box-sizing: border-box; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #2563eb; }
#loader {
    display: none; 
}
    </style>
</head>
   <script>
    const form = document.querySelector('form');
    const loader = document.getElementById('loader'); // تأكد أنك أعطيت الـ div الخاص بالـ svg هذا الـ id

    form.addEventListener('submit', function() {
        loader.style.display = 'block'; // يظهر الـ loader عند الضغط
    });
</script> 
<body>
    <div class="login-card">
        <h2>نظام برج 4 🎓</h2>
        <p style="color: #94a3b8;">دخول المسؤول</p>
        <form action="/auth" method="POST">
            <input type="text" name="username" placeholder="اسم المستخدم" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit">تسجيل الدخول</button>
</style>

        </form>
    </div>
    <script>
    // عند إرسال النموذج (الضغط على تسجيل الدخول)
    document.querySelector('form').addEventListener('submit', function() {
        // ابحث عن الـ loader واجعله يظهر
        document.getElementById('loader').style.display = 'block';
    });
</script>
</body>
</html>
